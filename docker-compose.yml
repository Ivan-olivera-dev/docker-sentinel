services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - EVENTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sentinel-internal

  sentinel:
    build: .
    container_name: docker-sentinel
    restart: unless-stopped
    depends_on:
      - docker-proxy
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - SENTINEL_MAX_RESTARTS=3
      - SENTINEL_TIME_WINDOW_SEC=300
      - SENTINEL_IGNORE_ZERO_EXIT=true
    env_file:
      - .env
    networks:
      - sentinel-internal

  # Optional demo workload to test auto-healing:
  # Run `docker kill --signal=SIGKILL sentinel-test-app` to trigger recovery.
  test-app:
    image: nginx:alpine
    container_name: sentinel-test-app
    labels:
      - "sentinel.enable=true"
      - "sentinel.max_restarts=3"
      - "sentinel.window_sec=300"

networks:
  sentinel-internal:
    driver: bridge
    internal: false
